services:
  ml-service:
    build:
      context: ../ml_service
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    networks:
      - opsmind-prod-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - ML_SERVICE_URL=http://ml-service:8000
      - CLIENT_URL=${CLIENT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - ml-service
    networks:
      - opsmind-prod-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_ML_SERVICE_URL=${VITE_ML_SERVICE_URL:-/api/ml}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - opsmind-prod-network

networks:
  opsmind-prod-network:
    driver: bridge
