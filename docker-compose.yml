services:
  # =================================================================
  # 1. MongoDB Database
  # =================================================================
  mongo:
    image: mongo:7.0
    container_name: opsmind-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: opsmind
    volumes:
      - mongodb_data:/data/db
    networks:
      - opsmind-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =================================================================
  # 2. FastAPI ML Service
  # =================================================================
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: opsmind-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    networks:
      - opsmind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ml/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =================================================================
  # 3. Express Backend API
  # =================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opsmind-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/opsmind
      - ML_SERVICE_URL=http://ml-service:8000
      - CLIENT_URL=http://localhost:80,http://localhost:5173,http://localhost
      - JWT_SECRET=production_opsmind_jwt_secret_token_secure_key_2026
      - JWT_EXPIRES_IN=7d
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - opsmind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =================================================================
  # 4. React Vite Frontend (Nginx)
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
        - VITE_ML_SERVICE_URL=http://localhost:8000/api/v1
    container_name: opsmind-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - opsmind-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  opsmind-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
